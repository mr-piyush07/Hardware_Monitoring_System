version: '3.8'

services:
  web:
    build: .
    command: gunicorn iot_monitoring.wsgi:application --bind 0.0.0.0:8000 --workers 4
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - DB_ENGINE=mongodb
      - MONGO_URI=mongodb+srv://<db_username>:<db_password>@cluster0.kvqh9ci.mongodb.net/?appName=Cluster0
      - MQTT_BROKER_HOST=mqtt
      - MQTT_BROKER_PORT=1883
    depends_on:
      - mqtt

  mqtt_worker:
    build: .
    command: python background_worker.py
    environment:
      - DB_ENGINE=mongodb
      - MONGO_URI=mongodb+srv://<db_username>:<db_password>@cluster0.kvqh9ci.mongodb.net/?appName=Cluster0
      - MQTT_BROKER_HOST=mqtt
      - MQTT_BROKER_PORT=1883
    depends_on:
      - mqtt

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
