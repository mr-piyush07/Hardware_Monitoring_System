version: '3.8'

services:
  web:
    build: .
    command: gunicorn iot_monitoring.wsgi:application --bind 0.0.0.0:8000 --workers 4
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - DB_ENGINE=postgresql
      - POSTGRES_DB=iot_monitoring_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_pass
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - MQTT_BROKER_HOST=mqtt
      - MQTT_BROKER_PORT=1883
    depends_on:
      - db
      - mqtt

  mqtt_worker:
    build: .
    command: python background_worker.py
    environment:
      - DB_ENGINE=postgresql
      - POSTGRES_DB=iot_monitoring_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_pass
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - MQTT_BROKER_HOST=mqtt
      - MQTT_BROKER_PORT=1883
    depends_on:
      - db
      - mqtt

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=iot_monitoring_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"

volumes:
  postgres_data:
