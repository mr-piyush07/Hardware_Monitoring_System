# Render Blueprint Spec (100% Free Tier Deployment)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: iot-monitoring-service
    env: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn iot_monitoring.wsgi:application --timeout 120 --workers 1
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOW_ALL
        value: "True"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: MONGO_URI
        value: "mongodb+srv://<db_username>:<db_password>@cluster0.kvqh9ci.mongodb.net/?appName=Cluster0"
