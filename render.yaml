# Render Blueprint Spec (100% Free Tier Deployment)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: iot-monitoring-service
    env: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn iot_monitoring.wsgi:application --timeout 120 --workers 1
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOW_ALL
        value: "True"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        value: "postgresql://iot_dashboard_gen7_user:J4icgWEaGCcpbjor9JnZi9lQrCKLAFig@dpg-da9ca6u7bikc738tj1rg-a/iot_dashboard_gen7"
